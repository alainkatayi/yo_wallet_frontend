<header class="flex shrink-0 items-center justify-between gap-3 border-b border-line bg-surface px-4 py-3 sm:px-6">
  <button
    type="button"
    class="inline-flex size-10 items-center justify-center rounded-control text-ink hover:bg-neutral lg:hidden"
    (click)="layout.toggleMenu()"
    [attr.aria-expanded]="layout.menuOpen()"
    aria-controls="app-sidebar"
    aria-label="Ouvrir le menu"
  >
    <app-icon name="menu" />
  </button>

  <p class="hidden items-center gap-2 rounded-full bg-tertiary-soft px-3 py-1 text-xs font-semibold text-tertiary-ink sm:inline-flex">
    <span class="size-1.5 rounded-full bg-tertiary"></span>
    Session active
  </p>

  <div class="ml-auto flex items-center gap-3">
    <span class="hidden text-sm font-medium text-ink sm:inline">{{ name() }}</span>
    <div
      class="flex size-9 items-center justify-center rounded-full bg-primary text-xs font-semibold text-primary-foreground"
      role="img"
      [attr.aria-label]="name()"
    >
      {{ initials() }}
    </div>
  </div>
</header>
