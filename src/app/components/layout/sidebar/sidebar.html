<aside
  id="app-sidebar"
  class="fixed inset-y-0 left-0 z-40 flex h-dvh w-64 shrink-0 flex-col bg-primary text-primary-foreground transition-transform duration-200 lg:sticky lg:top-0 lg:z-auto lg:translate-x-0"
  [class.max-lg:-translate-x-full]="!layout.menuOpen()"
>
  <div class="flex items-center gap-3 px-5 py-6">
    <span class="flex size-10 items-center justify-center rounded-control bg-tertiary text-tertiary-foreground">
      <app-icon name="wallet" />
    </span>
    <div>
      <p class="text-sm font-semibold">Yo Wallet</p>
      <p class="text-xs text-primary-muted">Portefeuille</p>
    </div>
  </div>

  <nav class="flex flex-1 flex-col gap-1 px-3" aria-label="Navigation principale">
    @for (item of items; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive
        #link="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        [class]="itemClass(link.isActive)"
        (click)="layout.closeMenu()"
      >
        <app-icon [name]="item.icon" [size]="18" />
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="p-3">
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-control px-3 py-2.5 text-sm font-medium text-primary-muted transition hover:bg-secondary hover:text-primary-foreground"
      (click)="layout.openLogout()"
    >
      <app-icon name="logout" [size]="18" />
      Se déconnecter
    </button>
  </div>
</aside>
