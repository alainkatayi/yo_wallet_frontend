<div class="flex min-h-dvh items-center justify-center bg-neutral p-4">
  <div class="w-full max-w-md rounded-card bg-surface p-8 text-center shadow-card">
    <p class="text-sm font-semibold text-tertiary-ink">404</p>
    <h1 class="mt-2 text-2xl font-semibold text-ink">Page introuvable</h1>
    <p class="mt-2 text-sm leading-6 text-muted">Cette adresse ne correspond à aucune page de Yo Wallet.</p>
    <a
      class="mt-6 inline-flex h-12 items-center justify-center rounded-control bg-primary px-4 text-sm font-semibold text-primary-foreground"
      [routerLink]="authenticated() ? '/tableau-de-bord' : '/connexion'"
    >
      {{ authenticated() ? 'Retour au tableau de bord' : 'Retour à la connexion' }}
    </a>
  </div>
</div>
