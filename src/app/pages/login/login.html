<app-auth-layout>
  <div class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight text-ink">Bon retour</h1>
    <p class="mt-1 text-sm text-muted">Saisissez vos identifiants pour accéder à votre portefeuille.</p>
  </div>

  <form class="flex flex-col gap-4" [formGroup]="form" novalidate (ngSubmit)="submit()">
    <app-form-field label="E-mail" inputId="email" [error]="emailError()">
      <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-muted">
          <app-icon name="mail" [size]="18" />
        </span>
        <input
          id="email"
          type="email"
          name="email"
          autocomplete="username"
          placeholder="nom@exemple.com"
          [class]="controlIconClass"
          [formControl]="form.controls.email"
          [attr.aria-invalid]="emailError() ? 'true' : null"
          [attr.aria-describedby]="emailError() ? 'email-error' : null"
        />
      </div>
    </app-form-field>

    <app-form-field label="Mot de passe" inputId="password" [error]="passwordError()">
      <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-muted">
          <app-icon name="lock" [size]="18" />
        </span>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="current-password"
          placeholder="Votre mot de passe"
          [class]="controlActionClass"
          [formControl]="form.controls.password"
          [attr.aria-invalid]="passwordError() ? 'true' : null"
          [attr.aria-describedby]="passwordError() ? 'password-error' : null"
        />
        <button
          type="button"
          class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-muted"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </div>
    </app-form-field>

    @if (formError()) {
      <p role="alert" class="rounded-control bg-danger-soft px-3 py-2 text-sm text-danger-ink">
        {{ formError() }}
      </p>
    }

    <app-button type="submit" [full]="true" [loading]="submitting()">
      Continuer vers le portefeuille
      <app-icon name="arrow-right" [size]="18" />
    </app-button>
  </form>

  <p class="mt-6 text-center text-sm text-muted">
    Pas encore de compte ?
    <a routerLink="/inscription" class="font-semibold text-tertiary-ink">Créer un compte</a>
  </p>
</app-auth-layout>
